else if(type==='journal'){html=title(t('journalLabel'),t('journal'));const count=Object.values(state.boards).filter(b=>b.done).length;html+=para(plural('tides',count)+(state.secrets.length?' · '+plural('secrets',state.secrets.length):''),'fine');html+='<div class="journal-list">';for(const i of [...state.secrets].reverse()){const c=S.secrets[i];html+='<div class="journal-item secret-item"><div class="eyebrow">'+esc(t('secretLabel'))+'</div><h3>'+esc(c.name)+'</h3>'+para(c.body)+'</div>';}if(state.started){html+='<div class="journal-item"><div class="eyebrow">'+esc(t('initialLabel'))+'</div>'+para(S.opening)+'</div>';for(let i=0;i<=Math.min(state.unlocked,17);i++){const c=S.chapters[i],done=state.boards[i]?.done;html+='<div class="journal-item"><div class="eyebrow">'+esc(t('chapter'))+' '+fmt(i+1)+(done?' · ◦':'')+'</div><h3>'+esc(c.name)+'</h3>'+para(done?c.fragment:c.lead)+'<button class="line-button memory-open" data-i="'+i+'">'+esc(t('memory'))+'</button>'+(done||i===state.unlocked?'<br><button class="line-button revisit-open" data-i="'+i+'">'+esc(t('revisit'))+'</button>':'')+'</div>';}}else html+=para(t('journalEmpty'));html+='</div>'+actions(action('modal-go','back')+(state.unlocked===18?action('watch-again','endingAgain',false):''));bind=()=>{if($('watch-again'))$('watch-again').onclick=()=>{closeModal();state.ending=null;startEnding(false);};document.querySelectorAll('.memory-open').forEach(el=>el.onclick=()=>openModal('memory',{level:Number(el.dataset.i)}));document.querySelectorAll('.revisit-open').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.i);closeModal();if(state.boards[i]?.done){const l=LEVELS[i];state.boards[i]={r:[...l.initial],f:[...l.flips],m:0,done:true};}loadLevel(i);});$('modal-go').onclick=closeModal;};}

addEventListener('keydown',e=>{if(modalState){if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const focusable=[...$('sheet').querySelectorAll('button:not([disabled]),input,[tabindex="0"]')].filter(el=>!el.hidden);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet'))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('sheet'))){e.preventDefault();first?.focus();}}return;}if(mode!=='play'||result?.solved)return;if(document.activeElement!==$('world')&&!e.key.startsWith('Arrow'))return;if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const points=view.points;if(selected<0)selected=LEVELS[state.level].nodes.findIndex(n=>!n.fixed);else {const dir={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key],p=points[selected];let best=-1,bestScore=Infinity;points.forEach((q,i)=>{if(i===selected)return;const dx=q.x-p.x,dy=q.y-p.y,along=dx*dir[0]+dy*dir[1],cross=Math.abs(dx*dir[1]-dy*dir[0]);if(along>2){const score=along+cross*2;if(score<bestScore){bestScore=score;best=i;}}});if(best>=0)selected=best;}sync();announce(selected);$('world').focus({preventScroll:true});}else if(e.key==='Enter'){e.preventDefault();if(selected<0)selected=LEVELS[state.level].nodes.findIndex(n=>!n.fixed);turn(selected,e.shiftKey?-1:1);}else if(e.key===' '){e.preventDefault();if(selected>=0)turn(selected,0,true);}});
